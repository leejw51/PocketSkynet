# CI — everything `make verify` covers: formatting, clippy (host and wasm32),
# unit + web + integration tests, and a wasm type-check of the client.
#
# The web bundle is built first because `web/dist` is gitignored and the gui
# crate's `tauri::generate_context!` requires it to exist even under `clippy`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: Verify (fmt, clippy, tests, wasm)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gui crate links against webkit2gtk even when only type-checked.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Pinned to the version development happens on, so clippy and rustfmt
      # can never disagree with a local `make verify`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1

      # Pinned to a version with published binaries; --disable-strategies
      # compile makes a missing binary a loud failure instead of a slow build.
      - name: Install trunk
        env:
          # Unauthenticated GitHub API calls get rate-limited on shared
          # runners, and binstall then cannot resolve any release artifact.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y --disable-strategies compile trunk@0.21.14

      # `app/web` is its own workspace with its own target dir, so both are
      # cached explicitly.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            app
            app/web

      - name: Build web bundle
        run: make web

      - name: Verify
        run: make verify
