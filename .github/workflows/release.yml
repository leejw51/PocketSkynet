# Release — build the macOS installer and attach it to a GitHub release.
#
# Triggered by pushing a tag like `v1.0.0` (which must match the workspace
# version in app/Cargo.toml), or manually via workflow_dispatch for a dry run
# that uploads the artifact without creating a release.
#
#   macos-latest → PocketSkynet_<version>_arm64.dmg
#
# `make package` drives everything: trunk builds the WASM client, tauri
# bundles the app, and scripts/make-dmg.sh wraps the bundle with plain
# hdiutil so it works headless.
#
# The .app is signed with the Developer ID certificate from the repo secrets
# (MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD) and notarized
# with APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / TEAM_ID; the .dmg is signed
# with the same identity. Without the secrets everything falls back to ad-hoc
# signing, so dry runs still produce an installer.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: app

jobs:
  package:
    name: Package (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version development happens on — same as CI.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - uses: cargo-bins/cargo-binstall@23ee8ab6b7397851bc11705bcdf46f2519ea0285 # v1.9.0

      # Pinned versions with published binaries, so binstall never falls back
      # to a from-source build (tauri-cli's CSS dependencies do not compile
      # with a floating registry resolution).
      - name: Install trunk and tauri-cli
        env:
          # Unauthenticated GitHub API calls get rate-limited on shared
          # runners, and binstall then cannot resolve any release artifact.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y --disable-strategies compile trunk@0.21.14 tauri-cli@2.11.4

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            app
            app/web

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${TAG#v}" != "$ver" ]; then
            echo "tag $TAG does not match Cargo.toml version $ver" >&2
            exit 1
          fi

      # A release that ships without this is not visibly broken: it installs,
      # launches and signs in, and only fails at the moment someone pays for a
      # shout. Better to lose the build than to publish that.
      - name: Check the deployment settings are present
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WALLET: ${{ secrets.VITE_FRUITNATION_WALLET }}
        run: |
          if [ -z "${WALLET// }" ]; then
            echo "VITE_FRUITNATION_WALLET is not set in repository secrets." >&2
            echo "The packaged app compiles this in; without it every paid" >&2
            echo "action fails with 'no payment wallet configured'." >&2
            exit 1
          fi

      # Imports the Developer ID certificate into a throwaway keychain and
      # exports APPLE_SIGNING_IDENTITY for the build. Falls back to ad-hoc
      # signing when the secret is absent (e.g. a fork's dry run).
      - name: Import codesigning certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 not set, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
            echo "Found certificate: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # Tauri picks up APPLE_SIGNING_IDENTITY to sign the .app, and
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID to notarize and staple it.
      # make-dmg.sh then signs the .dmg with the same identity.
      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
          # Compiled into the server (see app/server/build.rs). The desktop app
          # is launched by Finder with no shell to source `.env` and a bundle
          # carries none, so these must be present at build time or an installed
          # app reports "no payment wallet configured" for every paid action.
          # None of them is a secret in the cryptographic sense — a receiving
          # address and a public client id — but they are deployment
          # configuration, so they live with the rest of it.
          VITE_FRUITNATION_WALLET: ${{ secrets.VITE_FRUITNATION_WALLET }}
          VITE_FRUITNATION_HASH_CRO: ${{ secrets.VITE_FRUITNATION_HASH_CRO }}
          VITE_CHAIN_ID: ${{ secrets.VITE_CHAIN_ID }}
          VITE_PRIVY_APPID: ${{ secrets.VITE_PRIVY_APPID }}
        run: |
          if [ "${APPLE_SIGNING_IDENTITY:--}" = "-" ]; then
            # An ad-hoc-signed app cannot be notarized.
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          make package

      - name: Collect installer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/installers"
          find target/release/bundle -maxdepth 3 -name '*.dmg' \
            -not -name 'rw.*' \
            -exec cp {} "$GITHUB_WORKSPACE/installers/" \;
          ls -l "$GITHUB_WORKSPACE/installers"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pocketskynet-macos
          path: installers/*
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

  release:
    name: Create GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: installers/*
          generate_release_notes: true
