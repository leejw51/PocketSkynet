[package]
name = "pocketskynet-web"
description = "PocketSkynet web client: Yew + WebAssembly, styled with Topcoat"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

# Its own workspace root on purpose — see the root Cargo.toml. This crate only
# ever builds for wasm32-unknown-unknown.
[workspace]

[dependencies]
pocketskynet-core = { path = "../core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
thiserror = "1"

yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
gloo-events = "0.2"
futures = "0.3"
getrandom = { version = "0.2", features = ["js"] }
# Invite-link QR codes, rendered to an inline SVG string. `svg` only: the
# default `image` feature drags a raster stack into a `.wasm` that only
# needs markup.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    # `HtmlElement::style()` — the inline override that makes an instant
    # scroll actually instant against `.fn-scroll { scroll-behavior: smooth }`.
    "CssStyleDeclaration",
    # Watching the message stream re-render. A row's height is not final when
    # it first paints, and the re-render that settles it destroys the scroll
    # position — which no `scroll` or `load` event reliably announces.
    "MutationObserver",
    "MutationObserverInit",
    # `Window::match_media`, for the boot sequence's reduced-motion check.
    "MediaQueryList",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Location",
    "EventSource",
    "MessageEvent",
    "Storage",
    "ScrollToOptions",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "ScrollBehavior",
    "DomRect",
    "Navigator",
    # Jarvis's `get_location` tool. The browser asks the user before any of
    # these resolve to anything, so the permission prompt is the feature's
    # consent gate rather than something bolted on beside it.
    "Geolocation",
    "Position",
    "PositionError",
    "Coordinates",
    "Clipboard",
    # --- added by the client implementation -------------------------------
    # History/PopStateEvent: real-path routing per DESIGN.md §4, rather than
    # hash fragments, so `/rooms/:id` is a shareable URL.
    "History",
    "PopStateEvent",
    # Node/NodeList/DomTokenList: the modal focus trap walks the panel's
    # focusable descendants and the backdrop click test reads a class list.
    "Node",
    "NodeList",
    "DomTokenList",
    # Blob/Url/HtmlAnchorElement: "Download backup" writes the wallet file
    # entirely client-side — the mnemonic must never reach a server.
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    # WebGL2 for the sign-in backdrop (components/backdrop.rs). Raw GL rather
    # than a scene-graph library: the whole scene is one fullscreen quad, so a
    # renderer would be 600KB to draw two triangles, and this way the shader is
    # driven from Rust with no JS shim to keep in step.
    "HtmlCanvasElement",
    "HtmlImageElement",
    # 2D canvas for the portrait spotlight's particle trails
    # (components/spotlight.rs) — same reasoning as the GL backdrop: a
    # scene-graph library would be 600KB to orbit a hundred sparks.
    "CanvasRenderingContext2d",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlBuffer",
    "WebGlVertexArrayObject",
    "WebGlUniformLocation",
    "PointerEvent",
    # File/FileList: the composer's attach button reads a picked file's bytes
    # locally before POSTing them. `Blob::array_buffer` covers the read, so
    # FileReader is deliberately absent — one fewer API, and no event plumbing.
    "File",
    "FileList",
    # Video thumbnails are captured in the browser (capture.rs): an offscreen
    # <video> seeks a frame and a 2D canvas re-draws it. HtmlMediaElement is
    # HtmlVideoElement's parent class, where currentTime/duration/readyState
    # live; the canvas features above cover the drawing half.
    "HtmlVideoElement",
    "HtmlMediaElement",
    # An attachment download is authenticated, so it cannot be a bare href: the
    # bytes are fetched with the token and handed to the page as a blob URL.
    # That needs Response/Headers from the fetch side.
    "Response",
    "Headers",
    # `execCommand("copy")` lives on HtmlDocument. It is the only copy path that
    # works on an insecure origin, which is every LAN address this app is meant
    # to be opened on.
    "HtmlDocument",
    # A chunk upload request racing a timer (api/uploads.rs): a dead mobile
    # connection often stops answering rather than erroring, and `fetch`'s
    # promise then never settles either way. Aborting it on the clock is what
    # turns that into an ordinary network error the existing retry already
    # knows how to recover from.
    "AbortController",
    "AbortSignal",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
