<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="PocketSkynet — a blockchain-authenticated, end-to-end encrypted messenger."
    />
    <title>PocketSkynet</title>

    <!-- The colour behind the status bar and the window chrome once installed.
         Two values because the app follows the system scheme: `--fn-bg` in
         each, so the chrome is continuous with the page rather than a band of
         a different colour above it. -->
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070a0d" media="(prefers-color-scheme: dark)" />

    <!-- Everything under static/ is copied verbatim into dist/static/. -->
    <link data-trunk rel="copy-dir" href="static" />

    <!-- The two files that make this installable, copied to the site *root*
         rather than under static/. The manifest could live anywhere, but a
         service worker may only control the paths below its own URL, and this
         one has to control `/` — so `/sw.js` it is.

         `pwa/` is a directory of its own rather than part of static/ precisely
         because copy-dir would put these under /static/, where the worker's
         scope would be useless. -->
    <link data-trunk rel="copy-file" href="pwa/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="pwa/sw.js" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Declared explicitly so `wasm-opt -Oz` runs on release builds. The
         bundle is the largest thing on the wire and the first thing that has to
         parse before anything renders, so shrinking it buys both transfer time
         and startup time. Trunk fetches wasm-opt itself; debug builds skip it. -->
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
    <!-- The home-screen icon on iOS, and the same artwork the native iOS app
         ships (`ios/App/Resources/Assets.xcassets/AppIcon.appiconset`), so an
         installed web app and the native one are the same tile. Unmasked on
         purpose: the art is drawn for iOS's rounded-rect crop and already
         carries its own margin. -->
    <link rel="apple-touch-icon" href="/static/img/icon-180.png" />

    <!-- Safari honours only part of the manifest, and did not read it at all
         before 16.4. "Add to Home Screen" on iOS is still driven by these and
         by the apple-touch-icon above, so they are not redundant with the
         manifest — on an older iPhone they are the only copy that is read.

         The status bar stays `default` rather than `black-translucent`: the
         layout already pads by `env(safe-area-inset-*)` and could take the
         edge-to-edge treatment, but translucent pins the bar's text to white,
         which is unreadable over the light theme. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Skynet" />

    <!-- Topcoat first, then our layer on top of it. Both are vendored: the app
         must work on an air-gapped LAN, so nothing is fetched from a CDN.

         Ours goes through Trunk (`rel="css"`) rather than being linked out of
         copy-dir, so the emitted file carries a content hash. At a stable URL
         a phone will keep painting a stale sheet — iOS Safari sits on cached
         CSS across an ordinary reload even under `cache-control: no-cache`,
         and the symptom is a layout fix that looks like it never shipped. A
         hashed name makes a changed stylesheet a different URL, so there is
         nothing stale to serve. Its `url(…)` refs are all root-absolute
         (`/static/img/…`), so relocating the file does not disturb them.

         Topcoat stays on copy-dir deliberately: it is vendored and frozen, so
         it has no staleness to cause and no reason to be rehashed. -->
    <link rel="stylesheet" href="/static/vendor/topcoat/css/topcoat-desktop-light.css" />
    <link data-trunk rel="css" href="static/app.css" />

    <!-- Stamp the stored appearance before the first paint.

         The WASM bundle applies these itself on boot (`app.rs`), but that is
         one to two seconds after the browser has already painted the loading
         screen below. Without this the app opens on the *default* skin and
         theme for the whole of that time and then swaps — which on the cute
         skin means a near-black screen with a chrome skull, followed by a
         blue one with a mascot. A skin that announces itself by flashing the
         other skin first is not a skin anyone would keep on.

         Deliberately tiny, synchronous and last in `<head>`: it must run
         before the body paints, so it cannot be deferred, and anything that
         throws here would block the app entirely — hence the try/catch and
         the complete absence of anything that could fail interestingly.

         The values are JSON-encoded because `gloo_storage` writes them that
         way (`"dark"`, quotes included), so a bare `getItem` comparison would
         never match. Anything unparseable is ignored and the app corrects it
         a second later, which is exactly the pre-existing behaviour. -->
    <script>
      (function () {
        try {
          var read = function (key) {
            var raw = localStorage.getItem(key);
            if (!raw) return null;
            try { return JSON.parse(raw); } catch (e) { return raw; }
          };
          var root = document.documentElement;
          var theme = read("ps-theme");
          if (theme === "light" || theme === "dark") {
            root.setAttribute("data-theme", theme);
          }
          // Allow-listed rather than passed through, because this value is
          // written straight into an attribute the sheet selects on and it
          // comes out of storage any page on this origin could have set. The
          // list is `session.rs::Skin::as_str` minus the default, which writes
          // no attribute at all; a test there pins those strings.
          var skin = read("ps-skin");
          if (skin === "cuteskynet" || skin === "humanskynet") {
            root.setAttribute("data-skin", skin);
          }
        } catch (e) {
          /* Private mode, or storage disabled. The app applies both itself. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app-loading" class="ps-boot">
      <!-- A background rather than an `<img>`, so the mark follows the skin
           through `--img-logo` (§1.1) with no second copy of the resolution
           logic in the script above. -->
      <div class="ps-boot__mark" role="img" aria-label="PocketSkynet"></div>
      <p>Loading PocketSkynet…</p>
      <noscript>PocketSkynet needs JavaScript and WebAssembly enabled.</noscript>
    </div>

    <!-- Register the worker, but only where one belongs.
         * A secure context is a hard platform requirement — on a plain-HTTP LAN
           address `navigator.serviceWorker` is not even defined, which is one
           more reason `make https` is the way to join from a phone.
         * The desktop app is excluded by hand. Its window loads the embedded
           server over loopback, so it *is* a secure context and would happily
           install a worker — and then a cached shell inside the app would
           outlive an app update, which is a stale build nobody would think to
           look for. Tauri injects `__TAURI_INTERNALS__` before page scripts run.
         Deferred to `load` so registration never competes with the WASM fetch
         for the first paint. -->
    <script>
      window.addEventListener("load", function () {
        if (!("serviceWorker" in navigator) || !window.isSecureContext) return;
        if ("__TAURI_INTERNALS__" in window) return;
        navigator.serviceWorker.register("/sw.js").catch(function (error) {
          console.warn("service worker registration failed", error);
        });
      });
    </script>
  </body>
</html>
