[package]
name = "pocketskynet-tss"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Native-only by design (CRYPTO.md §15.3): cggmp21's Paillier arithmetic sits
# on rug/gmp-mpfr-sys, a C GMP build that cannot target wasm32-unknown-unknown.
# The web workspace must never depend on this crate.

[dependencies]
pocketskynet-core.workspace = true

# The audited threshold-ECDSA stack, same versions as the reviewed reference
# wallet this port derives from.
cggmp21 = { version = "0.6", features = ["curve-secp256k1"] }
round-based = { version = "0.4", features = ["derive", "sim", "sim-async"] }
rand_core = { version = "0.6", features = ["getrandom"] }

k256.workspace = true
sha3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
base64.workspace = true

# The passphrase seal on the wallet file (CRYPTO.md §15.4).
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
sha2.workspace = true
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
