[package]
name = "pocketskynet-tss"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Builds for BOTH native and wasm32-unknown-unknown (CRYPTO.md §15.3): every
# ceremony runs inside the web client, so shares never leave the browser.
# Native builds exist for the test suite and the vector generator only —
# the server must never link this crate again.

[dependencies]
pocketskynet-core.workspace = true

# The CGGMP24 successor of the audited `cggmp21` crate (same LFDT-Lockness
# lineage, MIT OR Apache-2.0). Its default `backend-num-bigint` feature is
# pure Rust, which is what lets this crate target wasm32 — the old crate's
# rug/GMP Paillier arithmetic could not. Everything is pinned with `=`:
# the 0.7.0-alpha train does not hold generic-ec versions in lockstep
# across its own crates (alpha.4 of the siblings moved to generic-ec 0.5
# while cggmp24 alpha.3 is built against 0.4), so a float would mix two
# `generic_ec_core`s and fail to compile.
cggmp24 = { version = "=0.7.0-alpha.3", features = ["curve-secp256k1"] }
cggmp24-keygen = "=0.7.0-alpha.3"
paillier-zk = "=0.7.0-alpha.3"

# `sim` is the synchronous state-machine driver: all parties advance in one
# loop on the calling thread, no async runtime — the same code path on a
# native test thread and inside a web worker.
round-based = { version = "0.4", features = ["derive", "sim"] }

rand_core = { version = "0.6", features = ["getrandom"] }

k256.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
base64.workspace = true

# The passphrase seal on the wallet file (CRYPTO.md §15.4).
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
sha2.workspace = true
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser has no /dev/urandom; the `js` feature routes getrandom at
# crypto.getRandomValues. Mirrors the same override in `core`.
getrandom = { workspace = true, features = ["js"] }
# `SystemTime::now` traps on wasm32-unknown-unknown; share files stamp
# `createdAt` from `Date.now()` there instead.
js-sys = "0.3"
