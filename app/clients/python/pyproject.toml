[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketskynet-client"
version = "0.1.0"
description = "Python client (library + CLI) for the PocketSkynet messenger server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "aioquic>=1.2",
    "coincurve>=19",
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
pskynet = "pocketskynet_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: boots a real pocketskynet server (needs a built app/target binary)",
]
